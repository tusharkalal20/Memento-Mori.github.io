<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memento Mori — Your Life in Weeks</title>
<style>
  :root{
    --bg: #f4f1ea;
    --ink: #1c1a17;
    --muted: #6b6558;
    --line: #d8d2c4;
    --card: #fffdf8;
    --accent: #8a3324;
    --lived: #3a3833;
    --future: #e8e3d6;
    --marked: #8a3324;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg: #171511;
      --ink: #eee9df;
      --muted: #a39c8c;
      --line: #3a352c;
      --card: #201d18;
      --lived: #c9c2b3;
      --future: #2a271f;
      --marked: #c9573f;
    }
  }
  html[data-theme="dark"]{
    --bg: #171511;
    --ink: #eee9df;
    --muted: #a39c8c;
    --line: #3a352c;
    --card: #201d18;
    --lived: #c9c2b3;
    --future: #2a271f;
    --marked: #c9573f;
  }
  html[data-theme="light"]{
    --bg: #f4f1ea;
    --ink: #1c1a17;
    --muted: #6b6558;
    --line: #d8d2c4;
    --card: #fffdf8;
    --lived: #3a3833;
    --future: #e8e3d6;
    --marked: #8a3324;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    padding: 2rem 1.25rem 4rem;
  }
  .wrap{max-width: 980px; margin: 0 auto;}
  h1{
    font-size: 1.9rem;
    font-weight: 400;
    letter-spacing: 0.02em;
    margin: 0 0 0.25rem;
    text-align:center;
  }
  .latin{
    text-align:center;
    color:var(--muted);
    font-style: italic;
    font-size: 0.95rem;
    margin-bottom: 1.75rem;
  }
  .setup{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding: 1.1rem 1.25rem;
    display:flex;
    flex-wrap:wrap;
    gap: 1rem 1.5rem;
    align-items:flex-end;
    margin-bottom: 1.5rem;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .field{display:flex; flex-direction:column; gap:0.3rem;}
  .field label{font-size:0.75rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted);}
  .field input{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:0.95rem;
    padding: 0.4rem 0.55rem;
    border:1px solid var(--line);
    border-radius:6px;
    background: var(--bg);
    color: var(--ink);
  }
  button{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:0.85rem;
    padding: 0.5rem 0.9rem;
    border-radius:6px;
    border:1px solid var(--line);
    background: transparent;
    color: var(--ink);
    cursor:pointer;
  }
  button:hover{ border-color: var(--accent); color: var(--accent); }
  button.primary{
    background: var(--accent);
    color: #fdf8f2;
    border-color: var(--accent);
  }
  button.primary:hover{ opacity:0.9; color:#fdf8f2; }

  .stats{
    display:flex;
    justify-content: space-between;
    flex-wrap:wrap;
    gap: 0.5rem 1.5rem;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 1.25rem;
    padding: 0 0.1rem;
  }
  .stats b{ color: var(--ink); font-weight: 600; }

  .modes{
    display:flex;
    gap:0.5rem;
    margin-bottom: 1rem;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    flex-wrap:wrap;
    align-items:center;
  }
  .modes span.lbl{font-size:0.75rem; color:var(--muted); margin-right:0.25rem;}
  .swatch{
    width: 22px; height:22px; border-radius:4px; cursor:pointer;
    border: 2px solid transparent;
  }
  .swatch.active{ border-color: var(--ink); }

  .grid-outer{
    background: var(--card);
    border:1px solid var(--line);
    border-radius: 10px;
    padding: 1.25rem 1.25rem 1rem;
    overflow-x:auto;
  }
  .grid-scroll{ min-width: 640px; }
  .decade-row{ display:flex; align-items:center; margin-bottom:2px; }
  .decade-label{
    width: 34px;
    flex: 0 0 34px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.68rem;
    color: var(--muted);
    text-align:right;
    padding-right: 8px;
  }
  .weeks{
    display:grid;
    grid-template-columns: repeat(52, 1fr);
    gap: 2.5px;
    flex:1;
  }
  .week{
    aspect-ratio: 1;
    border-radius: 1.5px;
    background: var(--future);
    cursor:pointer;
    transition: transform 0.06s ease;
  }
  .week:hover{ transform: scale(1.35); }
  .week.lived{ background: var(--lived); }
  .week.current{
    background: var(--accent);
    box-shadow: 0 0 0 1.5px var(--accent);
  }

  .legend{
    display:flex;
    flex-wrap:wrap;
    gap: 1rem;
    margin-top: 1rem;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.78rem;
    color: var(--muted);
    align-items:center;
  }
  .legend-item{ display:flex; align-items:center; gap:6px; }
  .legend-swatch{ width:12px; height:12px; border-radius:2px; }

  .footer-note{
    text-align:center;
    color: var(--muted);
    font-style: italic;
    font-size: 0.85rem;
    margin-top: 2rem;
  }

  #tooltip{
    position: fixed;
    pointer-events:none;
    background: var(--ink);
    color: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.72rem;
    padding: 4px 8px;
    border-radius: 5px;
    opacity:0;
    transform: translate(-50%, -130%);
    z-index: 10;
    white-space:nowrap;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Memento Mori</h1>
  <div class="latin">"Remember that you must die" — every square is one week of a life.</div>

  <div style="text-align:center; margin-bottom:1.25rem; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:0.8rem; color:var(--muted);">
    <label style="cursor:pointer; user-select:none;">
      <input type="checkbox" id="themeToggle" style="vertical-align:middle; margin-right:6px;">
      Dark mode
    </label>
  </div>

  <div class="setup">
    <div class="field">
      <label for="dob">Date of birth</label>
      <input type="date" id="dob">
    </div>
    <div class="field">
      <label for="years">Life expectancy (years)</label>
      <input type="number" id="years" value="90" min="1" max="120" style="width:80px;">
    </div>
    <button class="primary" id="build">Build calendar</button>
    <button id="colorLived">Color weeks lived</button>
    <button id="clearMarks">Clear my colors</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="modes">
    <span class="lbl">Mark weeks as:</span>
    <div class="swatch active" data-color="#8a3324" style="background:#8a3324;" title="Milestone (red)"></div>
    <div class="swatch" data-color="#3a6b52" style="background:#3a6b52;" title="Good period (green)"></div>
    <div class="swatch" data-color="#3f5f8a" style="background:#3f5f8a;" title="Hard period (blue)"></div>
    <div class="swatch" data-color="#b58a2e" style="background:#b58a2e;" title="Change / travel (gold)"></div>
    <div class="swatch" data-color="erase" style="background:repeating-linear-gradient(45deg,#999,#999 2px,#ccc 2px,#ccc 4px);" title="Erase mark"></div>
  </div>

  <div class="grid-outer">
    <div class="grid-scroll" id="gridScroll"></div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-swatch" style="background:var(--future)"></div> Future week</div>
    <div class="legend-item"><div class="legend-swatch" style="background:var(--lived)"></div> Lived week</div>
    <div class="legend-item"><div class="legend-swatch" style="background:var(--accent)"></div> Current week</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#3a6b52"></div> Your marks (click any square)</div>
  </div>

  <div class="footer-note">Click or drag across squares to mark weeks that mattered. Your marks are saved automatically.</div>
</div>

<div id="tooltip"></div>

<script>
(function(){
  var STORE_KEY = 'memento-mori-marks-v1';
  var CONFIG_KEY = 'memento-mori-config-v1';
  var marks = {};
  var config = { dob: null, years: 90 };
  var activeColor = '#8a3324';
  var isDragging = false;

  function loadLocal(){
    try{
      var m = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
      marks = m;
    }catch(e){ marks = {}; }
    try{
      var c = JSON.parse(localStorage.getItem(CONFIG_KEY) || 'null');
      if(c && c.dob){ config = c; }
    }catch(e){}
  }
  function saveMarks(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(marks)); }catch(e){}
  }
  function saveConfig(){
    try{ localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); }catch(e){}
  }

  var dobInput = document.getElementById('dob');
  var yearsInput = document.getElementById('years');
  var buildBtn = document.getElementById('build');
  var clearBtn = document.getElementById('clearMarks');
  var statsEl = document.getElementById('stats');
  var gridScroll = document.getElementById('gridScroll');
  var tooltip = document.getElementById('tooltip');
  var swatches = document.querySelectorAll('.swatch');

  swatches.forEach(function(sw){
    sw.addEventListener('click', function(){
      swatches.forEach(function(s){ s.classList.remove('active'); });
      sw.classList.add('active');
      activeColor = sw.getAttribute('data-color');
    });
  });

  function weeksBetween(d1, d2){
    return Math.floor((d2 - d1) / (1000*60*60*24*7));
  }

  function render(){
    var dobVal = config.dob;
    var totalYears = config.years || 90;
    if(!dobVal){
      gridScroll.innerHTML = '';
      statsEl.innerHTML = '';
      return;
    }
    var dob = new Date(dobVal + 'T00:00:00');
    var now = new Date();
    var livedWeeks = weeksBetween(dob, now);
    var totalWeeks = totalYears * 52;

    var pct = Math.min(100, Math.max(0, (livedWeeks/totalWeeks*100)));
    var yearsLived = ((now - dob) / (1000*60*60*24*365.25));
    var yearsLeft = Math.max(0, totalYears - yearsLived);

    statsEl.innerHTML =
      '<span><b>' + livedWeeks.toLocaleString() + '</b> weeks lived</span>' +
      '<span><b>' + Math.max(0, totalWeeks - livedWeeks).toLocaleString() + '</b> weeks remaining</span>' +
      '<span><b>' + pct.toFixed(1) + '%</b> of ' + totalYears + ' years elapsed</span>' +
      '<span><b>' + yearsLeft.toFixed(1) + '</b> years left (estimate)</span>';

    var html = '';
    for(var y = 0; y < totalYears; y++){
      html += '<div class="decade-row">';
      html += '<div class="decade-label">' + (y % 5 === 0 ? y : '') + '</div>';
      html += '<div class="weeks">';
      for(var w = 0; w < 52; w++){
        var idx = y*52 + w;
        var cls = 'week';
        var style = '';
        if(idx === livedWeeks){
          cls += ' current';
        } else if(idx < livedWeeks){
          cls += ' lived';
        }
        var key = idx.toString();
        if(marks[key]){
          style = ' style="background:' + marks[key] + ';"';
        }
        html += '<div class="' + cls + '" data-idx="' + idx + '"' + style + '></div>';
      }
      html += '</div></div>';
    }
    gridScroll.innerHTML = html;
    attachGridEvents();
  }

  function markWeek(el){
    var idx = el.getAttribute('data-idx');
    if(activeColor === 'erase'){
      delete marks[idx];
      el.style.background = '';
    } else {
      marks[idx] = activeColor;
      el.style.background = activeColor;
    }
    saveMarks();
  }

  function attachGridEvents(){
    var cells = gridScroll.querySelectorAll('.week');
    cells.forEach(function(cell){
      cell.addEventListener('mousedown', function(e){
        isDragging = true;
        markWeek(cell);
      });
      cell.addEventListener('mouseenter', function(e){
        if(isDragging){ markWeek(cell); }
        var idx = parseInt(cell.getAttribute('data-idx'), 10);
        showTooltip(e, idx);
      });
      cell.addEventListener('mouseleave', function(){
        tooltip.style.opacity = 0;
      });
      cell.addEventListener('touchstart', function(e){
        markWeek(cell);
      });
    });
  }

  function showTooltip(e, idx){
    if(!config.dob) return;
    var dob = new Date(config.dob + 'T00:00:00');
    var weekDate = new Date(dob.getTime() + idx*7*24*60*60*1000);
    var age = Math.floor(idx/52);
    tooltip.textContent = 'Age ' + age + ' — week of ' + weekDate.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
    tooltip.style.left = e.clientX + 'px';
    tooltip.style.top = e.clientY + 'px';
    tooltip.style.opacity = 1;
  }

  document.addEventListener('mouseup', function(){ isDragging = false; });

  buildBtn.addEventListener('click', function(){
    if(!dobInput.value){
      dobInput.focus();
      return;
    }
    config.dob = dobInput.value;
    config.years = parseInt(yearsInput.value, 10) || 90;
    saveConfig();
    render();
  });

  var colorLivedBtn = document.getElementById('colorLived');
  colorLivedBtn.addEventListener('click', function(){
    if(!config.dob){
      dobInput.focus();
      return;
    }
    var dob = new Date(config.dob + 'T00:00:00');
    var now = new Date();
    var livedWeeks = weeksBetween(dob, now);
    var color = activeColor === 'erase' ? '#8a3324' : activeColor;
    for(var idx = 0; idx < livedWeeks; idx++){
      marks[idx.toString()] = color;
    }
    saveMarks();
    render();
  });

  clearBtn.addEventListener('click', function(){
    if(confirm('Clear all your colored marks? This cannot be undone.')){
      marks = {};
      saveMarks();
      render();
    }
  });

  var themeToggle = document.getElementById('themeToggle');
  var THEME_KEY = 'memento-mori-theme-v1';
  var savedTheme = localStorage.getItem(THEME_KEY);
  if(savedTheme){
    document.documentElement.setAttribute('data-theme', savedTheme);
    themeToggle.checked = savedTheme === 'dark';
  }
  themeToggle.addEventListener('change', function(){
    var theme = themeToggle.checked ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem(THEME_KEY, theme);
  });

  loadLocal();
  if(config.dob){
    dobInput.value = config.dob;
    yearsInput.value = config.years;
    render();
  } else {
    var d = new Date();
    d.setFullYear(d.getFullYear() - 30);
    dobInput.value = d.toISOString().slice(0,10);
  }
})();
</script>
</body>
</html>
